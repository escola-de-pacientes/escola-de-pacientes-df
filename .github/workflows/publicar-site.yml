# Gera o site no próprio GitHub, a cada mudança em build/.
#
# Por que isto existe: o site era gerado numa máquina local e enviado pronto.
# Quando essa cópia local ficava desatualizada, o envio desfazia o trabalho
# que já estava no repositório — foi o que aconteceu em 26/07/2026, quando um
# envio automático devolveu build.pl e style.css a versões antigas e deixou
# uma página no ar sem estilo.
#
# Aqui não existe cópia local: o site é sempre gerado a partir do build/ que
# está no GitHub. Com isto no ar, NÃO É MAIS PRECISO rodar o gerador nem
# enviar a pasta docs/ à mão. Basta editar build/ e enviar.

name: Publicar o site

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:        # permite disparar à mão, pelo painel do GitHub

  # ============== POR QUE ISTO PRECISA EXISTIR ==============
  # A Action dos números comita build/assets/dados-simulacoes.json, o que
  # DEVERIA disparar o gatilho de push acima. Não dispara: o GitHub ignora, de
  # propósito, eventos causados por um envio feito com o GITHUB_TOKEN padrão --
  # é a trava que impede um workflow de se chamar em cascata para sempre.
  #
  # O resultado foi silencioso e por isso pior: em 23/08/2026 os números foram
  # buscados e comitados com sucesso, e a página continuou dizendo que eles não
  # tinham sido publicados. Nada falhou; a segunda etapa simplesmente não
  # aconteceu.
  #
  # `workflow_run` é a saída documentada: ele observa a CONCLUSÃO do outro
  # workflow, e não o commit que ele fez, então a trava não se aplica.
  # ==========================================================
  workflow_run:
    workflows: ["Atualizar os números das simulações"]
    types: [completed]

permissions:
  contents: write           # necessário para gravar a pasta docs/ de volta

# nunca duas gerações ao mesmo tempo, para não brigarem pelo mesmo commit
concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  gerar:
    name: Gerar docs/ a partir de build/
    runs-on: ubuntu-latest
    # ============== `completed` NÃO QUER DIZER `success` ==============
    # `workflow_run: types: [completed]` dispara também quando o outro workflow
    # FALHA ou é cancelado -- e aí não há número novo nenhum para publicar. Era
    # uma geração inteira rodando para descobrir que `docs/` já estava igual.
    #
    # A condição só pesa no caminho do `workflow_run`: `push` e
    # `workflow_dispatch` não têm `event.workflow_run`, e continuam passando.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o que o gerador usa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liburi-perl qrencode

      - name: Rodar o gerador
        run: perl build/build.pl

      # ============== A `main` PODE ANDAR DURANTE A GERAÇÃO ==============
      # O `concurrency` acima impede duas gerações ao mesmo tempo -- e só isso.
      # Ele não sabe de merge de PR nem do commit dos números, que acontecem por
      # fora e avançam a `main` entre o checkout e o envio. Quando isso
      # acontecia, o `git push` era recusado e a execução ficava VERMELHA com o
      # site desatualizado: foi a falha de 30/08/2026.
      #
      # ⚠️ A saída NÃO é `git pull --rebase`. Reaplicar o commit de `docs/` sobre
      # uma ponta nova publicaria um `docs/` gerado a partir do `build/` ANTIGO
      # -- e, pior, com aparência de sucesso. O que a página mostraria não seria
      # o que o repositório diz.
      #
      # A saída é REFAZER: voltar à ponta nova, rodar o gerador de novo e
      # comitar o que sair dela. `docs/` é gerado, então descartá-lo não perde
      # trabalho de ninguém -- é a diferença entre um arquivo derivado e um
      # arquivo escrito.
      #
      # Três tentativas: se a `main` andar três vezes seguidas durante uma
      # geração de segundos, o problema não é corrida, é outra coisa, e aí a
      # execução tem de ficar vermelha mesmo.
      # ===================================================================
      - name: Publicar, se alguma coisa mudou
        run: |
          git config user.name  "Gerador do site"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3; do
            if [ -z "$(git status --porcelain docs)" ]; then
              echo "A pasta docs/ já está igual ao que o gerador produz. Nada a publicar."
              exit 0
            fi

            echo "Mudanças encontradas:"
            git status --short docs | head -20

            git add docs
            git commit -q -m "Regenera docs/ a partir de build/ ($GITHUB_SHA)"

            # este envio mexe só em docs/, e o gatilho acima só observa build/,
            # então não dispara o processo de novo
            if git push; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi

            echo "::warning::A main andou durante a geração. Refazendo o site"
            echo "::warning::sobre a ponta nova (tentativa $tentativa de 3)."
            git fetch origin main
            git reset --hard origin/main
            perl build/build.pl
          done

          echo "::error::Três tentativas e a main continuou andando a cada uma."
          echo "::error::Isso não é corrida de segundos: confira o que está"
          echo "::error::empurrando para a main e dispare este workflow de novo."
          exit 1
