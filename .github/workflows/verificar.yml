# O gerador roda em todo PR, antes do merge.
#
# ============== POR QUE ISTO PRECISAVA EXISTIR ==============
# O site não tinha verificação nenhuma em PR. O `build.pl` podia quebrar e a
# descoberta acontecia DEPOIS do merge, quando a Action de publicação falhasse
# -- com a `main` já contendo o defeito e o site no ar com a versão anterior,
# sem que nada na página dissesse isso.
#
# ============== POR QUE RODAR O GERADOR INTEIRO, E NÃO SÓ `perl -c` ==============
# `perl -c` pega erro de sintaxe. O que quebra este gerador na prática é outra
# coisa: um marcador novo sem a sub que o desenha, um arquivo de dados com
# forma inesperada, uma página do manifesto sem o `.md` correspondente. Tudo
# isso compila e morre na execução.
#
# Rodar o gerador de verdade custa segundos e cobre os dois casos. A saída é
# descartada: quem publica `docs/` é a Action de publicação, na `main`, e um PR
# que gerasse `docs/` traria 463 arquivos de ruído para a revisão.
# ===========================================================

name: Verificar o gerador

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: verificar-gerador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    name: build.pl compila e roda
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # As mesmas do workflow de publicação. Se divergirem, o PR passa e a
      # publicação falha -- que é exatamente o que este workflow existe para
      # impedir.
      - name: Instalar o que o gerador usa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liburi-perl qrencode

      - name: Sintaxe
        run: perl -c build/build.pl

      - name: Gerar o site inteiro
        run: perl build/build.pl

      - name: Conferir que saiu página
        run: |
          n=$(find docs -name index.html | wc -l)
          echo "$n páginas geradas."
          # O gerador pode terminar com sucesso e produzir quase nada se o
          # manifesto for lido errado. Cem é um piso folgado: o site tem
          # centenas de páginas e nunca encolheria a esse ponto sem intenção.
          if [ "$n" -lt 100 ]; then
            echo "Poucas páginas: alguma coisa não foi lida. Reprovado."
            exit 1
          fi

      # ============== AS TRAVAS DA PUBLICAÇÃO CONTINUAM LÁ ==============
      # Duas falhas silenciosas já aconteceram neste repositório: em 23/08/2026
      # os números foram comitados e a página não foi regenerada (nada falhou),
      # e em 30/08/2026 a `main` andou durante a geração e o envio foi recusado.
      #
      # As correções das duas são LINHAS DENTRO DE WORKFLOW, e workflow não tem
      # teste que rode sozinho: some uma linha e nada quebra hoje -- quebra na
      # próxima corrida, semanas depois, com o site desatualizado e a aba
      # Actions verde. Este passo é o que impede a linha de sumir sem ninguém
      # ver.
      #
      # Ele lê o TEXTO dos workflows de propósito: o que se quer provar é que a
      # decisão continua escrita ali, não que ela funcione -- funcionar só se
      # prova com a `main` andando de verdade.
      # =================================================================
      - name: As travas da publicação continuam lá
        run: |
          python3 - <<'PY'
          import sys
          import yaml

          falhas = []

          def checar(condicao, mensagem):
              print(f"{'  ok  ' if condicao else 'FALHA '} {mensagem}")
              if not condicao:
                  falhas.append(mensagem)

          publicar = yaml.safe_load(open(".github/workflows/publicar-site.yml"))
          texto_publicar = open(".github/workflows/publicar-site.yml").read()
          job = publicar["jobs"]["gerar"]

          # `completed` inclui falha e cancelamento. Sem esta condição, uma
          # atualização de números que falhou dispara uma geração inteira.
          condicao = str(job.get("if", ""))
          checar(
              "workflow_run.conclusion" in condicao and "success" in condicao,
              "a publicação só segue quando a atualização dos números DEU CERTO",
          )

          passo = [p for p in job["steps"] if p["name"].startswith("Publicar")][0]
          corpo = passo["run"]

          # A correção de 30/08: quando o envio é recusado, o site é REFEITO
          # sobre a ponta nova. Reaplicar o commit por rebase publicaria um
          # docs/ gerado a partir do build/ antigo -- com cara de sucesso.
          checar(
              "git reset --hard origin/main" in corpo
              and "perl build/build.pl" in corpo,
              "envio recusado REFAZ o site sobre a ponta nova da main",
          )
          checar(
              "pull --rebase" not in corpo,
              "  e não reaplica o docs/ velho por rebase, que publicaria o build/ antigo",
          )
          checar(
              "exit 1" in corpo,
              "  e desiste em vermelho, em vez de tentar para sempre",
          )

          atualizar = yaml.safe_load(
              open(".github/workflows/atualizar-dados-simulacoes.yml")
          )
          passos = atualizar["jobs"]["atualizar"]["steps"]
          idade = [p for p in passos if "envelhecer" in p["name"]]
          checar(
              len(idade) == 1,
              "a atualização dos números confere a IDADE do que está no ar",
          )
          if idade:
              # `always()` porque os passos anteriores saem com 0 sem comitar
              # quando o Hub não responde: é justamente esse caso que precisa
              # ser visto.
              checar(
                  str(idade[0].get("if", "")).strip() == "always()",
                  "  e confere mesmo quando a busca não trouxe nada",
              )
              limite = [
                  linha
                  for linha in idade[0]["run"].splitlines()
                  if "LIMITE_DE_DIAS" in linha and "=" in linha
              ]
              valor = int(limite[0].split("=")[1].strip()) if limite else -1
              checar(
                  0 < valor <= 7,
                  f"  com um limite de dias que cabe num cron diário (leu: {valor})",
              )

          if falhas:
              print("")
              print(f"{len(falhas)} trava(s) de publicação sumiram.")
              sys.exit(1)
          print("")
          print("As travas da publicação estão no lugar.")
          PY
